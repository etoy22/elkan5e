name: Feature request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem or use case
          description: What are you trying to accomplish?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: Describe the behavior or content you would like to see.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Describe any alternative solutions or workarounds.
